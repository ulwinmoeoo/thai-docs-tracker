<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai Docs Tracker · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#070b1a;--bg2:#0e1532;--card:rgba(20,29,62,.72);--line:rgba(125,145,255,.2);--ink:#e9edff;--mute:#8f99c9;--brand:#6ea8ff;--brand2:#9b6bff;--on:#06102a;--ok:#2de2a0;--soon:#ffc14d;--late:#ff6b81;--okbg:rgba(45,226,160,.13);--soonbg:rgba(255,193,77,.14);--latebg:rgba(255,107,129,.15);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#eef1fb;--bg2:#fff;--card:rgba(255,255,255,.88);--line:#d5dcf4;--ink:#121a3b;--mute:#58628f;--brand:#3358e8;--brand2:#7a4de8;--on:#fff;--ok:#0e9d6b;--soon:#bf7800;--late:#d4314d;--okbg:#dff5ec;--soonbg:#fcefd2;--latebg:#fde0e5}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font:16px/1.55 "Space Grotesk",system-ui,sans-serif;background:radial-gradient(900px 500px at 90% -10%,rgba(155,107,255,.24),transparent 60%),radial-gradient(700px 500px at -10% 5%,rgba(110,168,255,.2),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
.mono,.kpi b,.stat b{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{position:relative;max-width:1040px;margin:0 auto;padding:16px}
.login{position:relative;max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;backdrop-filter:blur(10px);box-shadow:0 0 50px rgba(110,168,255,.12)}
.login h1{margin:0 0 4px;font-size:1.3rem}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:.92rem}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=date],textarea,.f{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:44px;font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:none;border-radius:12px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.pri{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;font-weight:700}
.full{width:100%;margin-top:18px}
.err{color:var(--late);min-height:1.4em;margin:8px 0 0;font-size:.9rem}
.mute{color:var(--mute);font-size:.88rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:1.5rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}

.grid3{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;backdrop-filter:blur(8px);margin-bottom:12px;min-width:0}
.grid2 .panel,.grid3 .panel{margin-bottom:0}
.panel h2{margin:0 0 10px;font-size:1rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 12px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
.chart{position:relative;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block}

.donut svg{width:150px;flex:none}
.donut .dc{fill:none;stroke-width:16;cursor:pointer;transition:stroke-width .15s,opacity .15s}
.donut .dc.dim{opacity:.35}.donut .dc.on{stroke-width:20}
.dn{font:700 1.5rem "JetBrains Mono",monospace;fill:var(--ink)}.dl{font-size:.55rem;fill:var(--mute)}
.lg{display:grid;gap:4px;font-size:.88rem}.lg button{display:flex;gap:8px;align-items:center;background:none;border:0;cursor:pointer;padding:2px 4px;border-radius:8px;text-align:left}
.lg button:hover,.lg button.on{background:var(--line)}.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg b{margin-left:auto;font-family:"JetBrains Mono",monospace}

.stage{display:grid;grid-template-columns:130px 1fr 32px;gap:8px;align-items:center;background:none;border:1px solid transparent;border-radius:12px;padding:6px 8px;cursor:pointer;text-align:left}
.stage:hover{background:var(--line)}.stage.on{border-color:var(--brand);background:var(--line)}
.sbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.sbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .6s}
.stage b{font-family:"JetBrains Mono",monospace;text-align:right}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px}
.vb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.72rem;color:var(--mute);position:relative}
.vb i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--brand2),var(--brand));min-height:3px;transition:height .6s}
.vb em{font-style:normal;position:absolute;top:-2px;opacity:0;font-family:"JetBrains Mono",monospace;color:var(--ink);transition:opacity .15s;white-space:nowrap}
.vb:hover em,.vb:focus em{opacity:1}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:620px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.pill{border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.soon{background:var(--soonbg);color:var(--soon)}.pill.late{background:var(--latebg);color:var(--late)}.pill.off{background:var(--line);color:var(--mute)}
.row-top{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.row-top input{flex:1;min-width:160px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--bg2);color:var(--ink);width:min(92vw,480px);max-height:88vh;max-height:88dvh;overflow-y:auto;padding:18px}
dialog::backdrop{background:rgba(3,6,18,.65);backdrop-filter:blur(3px)}
.slip{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
</style>
</head>

const $=s=>document.querySelector(s);

const TYPES={r90:"90-day report",visa:"Visa",passport:"Passport",license:"Driving license",permit:"Work permit",other:"Other"};
const DAY=864e5;let users=[],q="";

function showLogin(msg){

 $("#lf").onsubmit=async e=>{e.preventDefault();$("#er").textContent="";

async function gate(){
 const{data}=await sb.auth.getSession();if(!data.session)return showLogin();

let reqs=[];

const pc=s=>s==="done"?"ok":s==="cancelled"?"off":s==="payment_submitted"||s==="requested"?"late":"soon";
async function upd(id,patch){const r=await sb.from("requests").update(Object.assign({updated_at:new Date().toISOString()},patch)).eq("id",id);if(r.error){$("#qm").textContent=r.error.message;return false}return true}
async function openReq(id){
 const r=reqs.find(x=>x.id===id),u=users.find(x=>x.id===r.user_id)||{name:""};
 const d=r.document_id?(await sb.from("documents").select("name,date,photo_path").eq("id",r.document_id).maybeSingle()).data:null;
 let img="",slip="";
 if(d&&d.photo_path){const g=await sb.storage.from("doc-photos").createSignedUrl(d.photo_path,3600);if(g.data)img=`<p class="mute">Document photo</p><img class="slip" src="${g.data.signedUrl}" alt="">`}
 if(r.slip_path){const g=await sb.storage.from("doc-photos").createSignedUrl(r.slip_path,3600);if(g.data)slip=`<p class="mute">Payment slip</p><img class="slip" src="${g.data.signedUrl}" alt="">`}

 if(d)h+=`<p class="mute">Number or name: ${esc(d.name||"–")} · Current date: ${esc(d.date)}</p>`;
 if(r.note)h+=`<p>User note: ${esc(r.note)}</p>`;
 if(r.auto_check)h+=`<p class="mute">Auto-check: ${esc(r.auto_check)}</p>`;
 h+=img+slip;
 let a="";
 if(s==="requested"||s==="quoted"){
  h+=`<label for="qp">Price (THB)</label><input class="f" type="number" id="qp" value="${r.price!=null?esc(r.price):""}"><label for="qi">How to pay (bank or PromptPay)</label><textarea class="f" id="qi" rows="3">${esc(r.pay_info||"")}</textarea><label for="qn">Note to user</label><input class="f" type="text" id="qn" value="${esc(r.admin_note||"")}">`;
  a+=`<button class="btn pri" data-act="quote">${s==="quoted"?"Update quote":"Send quote"}</button>`}
 if(s==="payment_submitted")a+=`<button class="btn" data-act="reject">Reject slip</button><button class="btn pri" data-act="confirm">Confirm payment</button>`;
 if(s==="confirmed")a+=`<button class="btn pri" data-act="start">Start processing</button>`;
 if(s==="in_progress"){h+=`<label for="qd2">New date (expiry date, or last report date for 90-day report)</label><input class="f" type="date" id="qd2">`;a+=`<button class="btn pri" data-act="done">Complete and update document</button>`}
 if(s!=="done"&&s!=="cancelled")a+=`<button class="btn" data-act="cancel" style="color:var(--late)">Cancel request</button>`;
 $("#qd").innerHTML=h+`<p class="err" id="qm" role="alert"></p><div class="acts">`+a+`<button class="btn" data-act="close">Close</button></div>`;
 $("#qd").querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
  const k=b.dataset.act;let ok=true;
  if(k==="close")return $("#qd").close();
  if(k==="quote"){const p=$("#qp").value;if(p===""){$("#qm").textContent="Enter a price.";return}ok=await upd(id,{status:"quoted",price:Number(p),pay_info:$("#qi").value.trim(),admin_note:$("#qn").value.trim()})}
  if(k==="reject")ok=await upd(id,{status:"quoted",slip_path:null,admin_note:"Payment slip rejected. Please send a clear slip."});
  if(k==="confirm")ok=await upd(id,{status:"confirmed"});
  if(k==="start")ok=await upd(id,{status:"in_progress"});
  if(k==="cancel")ok=await upd(id,{status:"cancelled"});
  if(k==="done"){const dt=$("#qd2").value;if(!dt){$("#qm").textContent="Choose the new date.";return}const x=await sb.rpc("admin_complete_request",{req:id,new_d:dt});if(x.error){$("#qm").textContent=x.error.message;ok=false}}
  if(ok){$("#qd").close();showDash()}
 });
 $("#qd").showModal();
}

function reqRows(){
 const nm=id=>(users.find(u=>u.id===id)||{}).name||"";
 const l=reqs.filter(r=>flt==="all"||r.status===flt);
 $("#rb").innerHTML=l.map(r=>`<tr><td>${esc(nm(r.user_id))}</td><td>${esc(TYPES[r.doc_cat]||"")}</td><td><span class="pill ${pc(r.status)}">${ST[r.status]}</span></td><td class="mono">${r.price!=null?esc(r.price):"–"}</td><td>${new Date(r.created_at).toLocaleDateString()}</td><td><button class="btn" data-r="${r.id}">Open</button></td></tr>`).join("")||'<tr><td colspan="6" class="mute">No requests here.</td></tr>';
 document.querySelectorAll("#rb button").forEach(b=>b.onclick=()=>openReq(b.dataset.r));
}
let rng=30,flt="all",SD=null;
const COL=["#6ea8ff","#9b6bff","#2de2a0","#ffc14d","#ff6b81","#22d3ee"];
function cnt(el){const to=+el.dataset.n;if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=to.toLocaleString();return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);el.textContent=Math.round(to*(1-Math.pow(1-k,3))).toLocaleString();if(k<1)requestAnimationFrame(f)})(t0)}
function area(vals,labs){
 const W=600,H=170,P=10,n=vals.length,mx=Math.max(1,...vals),x=i=>P+(n<2?0:i*(W-2*P)/(n-1)),y=v=>H-P-(v/mx)*(H-2*P-12);
 const pts=vals.map((v,i)=>[x(i),y(v)]),ln=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
 const gl=[0,.5,1].map(k=>`<line x1="${P}" x2="${W-P}" y1="${(H-P-k*(H-2*P-12)).toFixed(1)}" y2="${(H-P-k*(H-2*P-12)).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 5"/>`).join("");
 return `<div class="chart" id="ch"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Signups chart"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".5"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>${gl}<path d="${ln} L${x(n-1)} ${H-P} L${x(0)} ${H-P}Z" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px var(--brand))"/><line id="cl" y1="0" y2="${H}" stroke="var(--brand2)" opacity="0"/><circle id="cd" r="5" fill="var(--brand2)" opacity="0"/></svg><div class="tip" id="tp"></div></div>`}
function hoverArea(vals,labs){
 const c=$("#ch");if(!c)return;const W=600,P=10,n=vals.length,mx=Math.max(1,...vals),H=170;
 const mv=e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((px-P)/(W-2*P)*(n-1)))),X=P+(n<2?0:i*(W-2*P)/(n-1)),Y=H-P-(vals[i]/mx)*(H-2*P-12);
  $("#cl").setAttribute("x1",X);$("#cl").setAttribute("x2",X);$("#cl").setAttribute("opacity",.6);$("#cd").setAttribute("cx",X);$("#cd").setAttribute("cy",Y);$("#cd").setAttribute("opacity",1);
  const tp=$("#tp");tp.textContent=labs[i]+" · "+vals[i];tp.style.left=Math.max(50,Math.min(r.width-50,X/W*r.width))+"px";tp.style.opacity=1};
 c.onpointermove=mv;c.onpointerdown=mv;c.onpointerleave=()=>{$("#tp").style.opacity=0;$("#cl").setAttribute("opacity",0);$("#cd").setAttribute("opacity",0)}}
function donut(ent,total){
 const R=54,C=2*Math.PI*R;let acc=0;
 const segs=ent.map(([nm,v],i)=>{const len=total?v/total*C:0,s=`<circle class="dc" data-i="${i}" cx="70" cy="70" r="${R}" stroke="${COL[i%6]}" stroke-dasharray="${Math.max(0,len-2).toFixed(1)} ${(C-Math.max(0,len-2)).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 70 70)"><title>${nm}: ${v}</title></circle>`;acc+=len;return s}).join("");
 return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Documents by type"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>${segs}<text class="dn" id="dn" x="70" y="72" text-anchor="middle">${total}</text><text class="dl" id="dl" x="70" y="88" text-anchor="middle">Documents</text></svg><div class="lg">${ent.map(([nm,v],i)=>`<button data-i="${i}"><i style="background:${COL[i%6]}"></i>${nm}<b>${v}</b></button>`).join("")}</div></div>`}
function hoverDonut(ent,total){
 const set=i=>{document.querySelectorAll(".dc").forEach(c=>{c.classList.toggle("on",+c.dataset.i===i);c.classList.toggle("dim",i>=0&&+c.dataset.i!==i)});document.querySelectorAll(".lg button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));$("#dn").textContent=i>=0?ent[i][1]:total;$("#dl").textContent=i>=0?ent[i][0]:"Documents"};
 document.querySelectorAll(".dc,.lg button").forEach(e=>{e.onpointerenter=()=>set(+e.dataset.i);e.onclick=()=>set(+e.dataset.i);e.onpointerleave=()=>set(-1)})}
async function showDash(){
 $("#app").innerHTML='<div class="wrap"><p class="mute">Loading…</p></div>';
 const[s,p,d,rq]=await Promise.all([sb.rpc("admin_stats"),sb.from("profiles").select("*").order("last_active",{ascending:false}),sb.from("documents").select("user_id,cat,date"),sb.from("requests").select("*").order("created_at",{ascending:false})]);
 const bad=s.error||p.error||d.error;
 if(bad){$("#app").innerHTML=`<div class="wrap"><p class="err">${esc(bad.message)}</p><button class="btn" id="lo">Log out</button></div>`;$("#lo").onclick=out;return}
 const now=Date.now();reqs=rq.error?[]:rq.data;
 users=p.data.map(u=>{const my=d.data.filter(x=>x.user_id===u.id);return{id:u.id,name:u.name||"(no name yet)",lang:u.lang==="my"?"Myanmar":"English",docs:my.length,nextDue:my.length?Math.min(...my.map(due)):null,active:Math.floor((now-new Date(u.last_active))/DAY),joined:Math.floor((now-new Date(u.created_at))/DAY),off:u.suspended}});
 SD={s:s.data};draw();
}
function draw(){
 const t=SD.s,now=Date.now(),bt=t.by_type||{},ent=Object.keys(TYPES).map(k=>[TYPES[k],bt[k]||0]);
 const paid=reqs.filter(r=>["confirmed","in_progress","done"].includes(r.status)&&r.price!=null);
 const rev=paid.reduce((a,r)=>a+Number(r.price),0),need=reqs.filter(r=>r.status==="requested"||r.status==="payment_submitted").length;
 const vals=Array(rng).fill(0),labs=[];for(let i=0;i<rng;i++)labs.push(new Date(now-(rng-1-i)*DAY).toLocaleDateString(undefined,{day:"numeric",month:"short"}));
 users.forEach(u=>{if(u.joined<rng)vals[rng-1-u.joined]++});
 const wk=Array(8).fill(0);paid.forEach(r=>{const w=Math.floor((now-new Date(r.updated_at))/(7*DAY));if(w<8)wk[7-w]+=Number(r.price)});const wm=Math.max(1,...wk);
 const order=["requested","quoted","payment_submitted","confirmed","in_progress","done","cancelled"],cn=s=>reqs.filter(r=>r.status===s).length,sm=Math.max(1,...order.map(cn));
 const K=(n,l,c)=>`<div class="kpi" style="--c:${c}"><b data-n="${n}">0</b><span>${l}</span></div>`;
 $("#app").innerHTML=`<div class="wrap">
 <div class="top"><div><h1>Thai Docs Tracker</h1><span class="mute">Admin · live data</span></div><button class="btn" id="lo">Log out</button></div>
 <div class="kpis">${K(t.total_users,"Total users","#6ea8ff")}${K(t.active_7d,"Active, 7 days","#2de2a0")}${K(t.new_30d,"New, 30 days","#9b6bff")}${K(t.documents,"Documents tracked","#22d3ee")}${K(need,"Needs your action","#ff6b81")}${K(Math.round(rev),"Revenue (THB)","#ffc14d")}</div>
 <div class="grid2"><div class="panel"><h2>New users <span class="seg" role="group" aria-label="Range">${[7,30,90].map(r=>`<button data-r="${r}" aria-pressed="${r===rng}">${r}d</button>`).join("")}</span></h2>${area(vals,labs)}</div>
 <div class="panel"><h2>Documents by type</h2>${donut(ent,t.documents)}</div></div>
 <div class="grid3"><div class="panel"><h2>Request pipeline</h2><div class="stages"><button class="stage ${flt==="all"?"on":""}" data-s="all"><span>All</span><span class="sbar"><i style="width:100%"></i></span><b>${reqs.length}</b></button>${order.map(s=>`<button class="stage ${flt===s?"on":""}" data-s="${s}"><span>${ST[s]}</span><span class="sbar"><i style="width:${cn(s)/sm*100}%"></i></span><b>${cn(s)}</b></button>`).join("")}</div></div>
 <div class="panel"><h2>Revenue per week (THB)</h2><div class="bars">${wk.map((v,i)=>`<div class="vb" tabindex="0" aria-label="${v} THB"><em>${v}</em><i style="height:${Math.max(2,v/wm*100)}%"></i><span>W${i+1}</span></div>`).join("")}</div></div></div>
 <div class="panel"><h2>Renewal requests <span class="mute" id="rf"></span></h2><div class="scroll"><table><thead><tr><th>User</th><th>Document</th><th>Status</th><th>Price</th><th>Date</th><th></th></tr></thead><tbody id="rb"></tbody></table></div></div>
 <dialog id="qd"></dialog>
 <div class="panel"><h2>Users</h2><div class="row-top"><input type="search" id="sq" placeholder="Search phone or email" aria-label="Search users" value="${esc(q)}"><span class="mute" id="cnt"></span></div>
 <div class="scroll"><table><thead><tr><th>User</th><th>Language</th><th>Docs</th><th>Next deadline</th><th>Last active</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></div>`;
 document.querySelectorAll("[data-n]").forEach(cnt);
 $("#lo").onclick=out;$("#sq").oninput=e=>{q=e.target.value;rows()};
 document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{rng=+b.dataset.r;draw()});
 document.querySelectorAll(".stage").forEach(b=>b.onclick=()=>{flt=b.dataset.s;document.querySelectorAll(".stage").forEach(x=>x.classList.toggle("on",x===b));$("#rf").textContent=flt==="all"?"":"· "+ST[flt];reqRows()});
 hoverArea(vals,labs);hoverDonut(ent,t.documents);rows();reqRows();$("#rf").textContent=flt==="all"?"":"· "+ST[flt];
}

function rows(){
 const k=q.toLowerCase(),l=users.filter(u=>u.name.toLowerCase().includes(k));
 $("#cnt").textContent=l.length+" shown";
 $("#tb").innerHTML=l.map(u=>{const[c,tx]=st(u);return`<tr><td>${esc(u.name)}</td><td>${u.lang}</td><td>${u.docs}</td><td>${fmtDue(u.nextDue)}</td><td>${u.active===0?"today":u.active+" d ago"}</td><td><span class="pill ${c}">${tx}</span></td><td><button class="btn" data-id="${u.id}">${u.off?"Restore":"Suspend"}</button></td></tr>`}).join("");
 document.querySelectorAll("#tb button").forEach(b=>b.onclick=async()=>{const u=users.find(x=>x.id===b.dataset.id);await sb.from("profiles").update({suspended:!u.off}).eq("id",u.id);showDash()});
}
gate();
</script>
</body>
</html>
