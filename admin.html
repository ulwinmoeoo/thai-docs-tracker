<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai Docs Tracker · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f3ee;--card:#fff;--ink:#1b2340;--mute:#5d6480;--line:#dcdbd2;--brand:#27348b;--on:#fff;--ok:#1d7a4f;--soon:#b7650a;--late:#b3261e;--okbg:#e2f3ea;--soonbg:#fdeccf;--latebg:#fbe0dd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162b;--card:#1c2240;--ink:#eceefb;--mute:#a4abd0;--line:#333b66;--brand:#8e9cff;--on:#12162b;--ok:#6fd6a0;--soon:#f2b45c;--late:#ff8f86;--okbg:#17382b;--soonbg:#3f2f12;--latebg:#4a1f1c}}
:root[data-theme="dark"]{--bg:#12162b;--card:#1c2240;--ink:#eceefb;--mute:#a4abd0;--line:#333b66;--brand:#8e9cff;--on:#12162b;--ok:#6fd6a0;--soon:#f2b45c;--late:#ff8f86;--okbg:#17382b;--soonbg:#3f2f12;--latebg:#4a1f1c}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 "Figtree",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.login h1{margin:0 0 4px;font-size:1.3rem}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:.92rem}
input[type=text],input[type=password],input[type=search]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.btn{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--brand);color:var(--on);border-color:var(--brand);font-weight:700}
.full{width:100%;margin-top:18px}
.err{color:var(--late);min-height:1.4em;margin:8px 0 0;font-size:.9rem}
.mute{color:var(--mute);font-size:.88rem}
.banner{background:var(--soonbg);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:10px 0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.3rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.9rem;line-height:1.15}
.stat span{color:var(--mute);font-size:.86rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{margin:0 0 10px;font-size:1rem}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.bar i{display:block;height:12px;border-radius:6px;background:var(--brand)}
.wk{display:flex;align-items:flex-end;gap:6px;height:110px}
.wk div{flex:1;text-align:center;font-size:.72rem;color:var(--mute)}
.wk i{display:block;background:var(--brand);border-radius:4px 4px 0 0;margin-bottom:2px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:620px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:.82rem}
.pill{border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.soon{background:var(--soonbg);color:var(--soon)}.pill.late{background:var(--latebg);color:var(--late)}.pill.off{background:var(--line);color:var(--mute)}
.row-top{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row-top input{flex:1;min-width:160px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://ydtymoiodzvcxtdolsrq.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkdHltb2lvZHp2Y3h0ZG9sc3JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNTU1MzIsImV4cCI6MjExMDgzMTUzMn0.mAzHbbDkBE8TCyOmzkvNdrSYY6rn0ktA5LCEvNH5jRM");
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TYPES={r90:"90-day report",visa:"Visa",passport:"Passport",license:"Driving license",permit:"Work permit",other:"Other"};
const DAY=864e5;let users=[],q="";
function due(d){const x=new Date(d.date+"T00:00:00");if(d.cat==="r90")x.setDate(x.getDate()+90);return Math.round((x-new Date(new Date().toDateString()))/DAY)}
function fmtDue(n){return n===null?"–":n<0?Math.abs(n)+" days overdue":n===0?"today":"in "+n+" days"}
function st(u){return u.off?["off","Suspended"]:u.nextDue!==null&&u.nextDue<0?["late","Overdue"]:u.nextDue!==null&&u.nextDue<=14?["soon","Due soon"]:["ok","OK"]}
function showLogin(msg){
 $("#app").innerHTML=`<form class="login" id="lf"><h1>Admin login</h1><p class="mute">Sign in with your admin account.</p>
 <label for="u">Email</label><input type="text" id="u" inputmode="email" autocomplete="username" required>
 <label for="p">Password</label><input type="password" id="p" autocomplete="current-password" required>
 <p class="err" id="er" role="alert">${esc(msg||"")}</p><button class="btn pri full" type="submit">Log in</button></form>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();$("#er").textContent="";
  const r=await sb.auth.signInWithPassword({email:$("#u").value.trim(),password:$("#p").value});
  if(r.error){$("#er").textContent=r.error.message;return}
  gate()};
}
async function gate(){
 const{data}=await sb.auth.getSession();if(!data.session)return showLogin();
 const a=await sb.from("admins").select("user_id").eq("user_id",data.session.user.id).maybeSingle();
 if(!a.data){await sb.auth.signOut();return showLogin("This account is not an admin.")}
 showDash();
}
async function out(){await sb.auth.signOut();showLogin()}
async function showDash(){
 $("#app").innerHTML='<div class="wrap"><p class="mute">Loading…</p></div>';
 const[s,p,d]=await Promise.all([sb.rpc("admin_stats"),sb.from("profiles").select("*").order("last_active",{ascending:false}),sb.from("documents").select("user_id,cat,date")]);
 const bad=s.error||p.error||d.error;
 if(bad){$("#app").innerHTML=`<div class="wrap"><p class="err">${esc(bad.message)}</p><button class="btn" id="lo">Log out</button></div>`;$("#lo").onclick=out;return}
 const now=Date.now();
 users=p.data.map(u=>{const my=d.data.filter(x=>x.user_id===u.id);
  return{id:u.id,name:u.name||"(no name yet)",lang:u.lang==="my"?"Myanmar":"English",docs:my.length,nextDue:my.length?Math.min(...my.map(due)):null,active:Math.floor((now-new Date(u.last_active))/DAY),joined:Math.floor((now-new Date(u.created_at))/DAY),off:u.suspended}});
 const t=s.data,bt=t.by_type||{},types=Object.keys(TYPES).map(k=>[TYPES[k],bt[k]||0]),mx=Math.max(1,...types.map(x=>x[1]));
 const wk=Array.from({length:8},(_,i)=>users.filter(u=>Math.floor(u.joined/7)===7-i).length),wm=Math.max(1,...wk);
 $("#app").innerHTML=`<div class="wrap">
 <div class="top"><h1>Thai Docs Tracker · Admin</h1><button class="btn" id="lo">Log out</button></div>
 <p class="mute">Live data from your database.</p>
 <div class="stats">
  <div class="stat"><b>${t.total_users}</b><span>Total users</span></div>
  <div class="stat"><b>${t.active_7d}</b><span>Active, last 7 days</span></div>
  <div class="stat"><b>${t.new_30d}</b><span>New, last 30 days</span></div>
  <div class="stat"><b>${t.documents}</b><span>Documents tracked</span></div>
  <div class="stat"><b>${t.overdue_users}</b><span>Users with overdue item</span></div></div>
 <div class="grid2">
  <div class="panel"><h2>Documents by type</h2>${types.map(([n,c])=>`<div class="bar"><span>${n}</span><i style="width:${Math.max(4,c/mx*100)}%"></i><b>${c}</b></div>`).join("")}</div>
  <div class="panel"><h2>New users per week (last 8)</h2><div class="wk">${wk.map((n,i)=>`<div><i style="height:${Math.max(3,n/wm*84)}px"></i>${n}<br>W${i+1}</div>`).join("")}</div></div></div>
 <div class="panel"><h2>Users</h2>
  <div class="row-top"><input type="search" id="sq" placeholder="Search email" aria-label="Search users" value="${esc(q)}"><span class="mute" id="cnt"></span></div>
  <div class="scroll"><table><thead><tr><th>User</th><th>Language</th><th>Docs</th><th>Next deadline</th><th>Last active</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></div>`;
 $("#lo").onclick=out;$("#sq").oninput=e=>{q=e.target.value;rows()};rows();
}
function rows(){
 const k=q.toLowerCase(),l=users.filter(u=>u.name.toLowerCase().includes(k));
 $("#cnt").textContent=l.length+" shown";
 $("#tb").innerHTML=l.map(u=>{const[c,tx]=st(u);return`<tr><td>${esc(u.name)}</td><td>${u.lang}</td><td>${u.docs}</td><td>${fmtDue(u.nextDue)}</td><td>${u.active===0?"today":u.active+" d ago"}</td><td><span class="pill ${c}">${tx}</span></td><td><button class="btn" data-id="${u.id}">${u.off?"Restore":"Suspend"}</button></td></tr>`}).join("");
 document.querySelectorAll("#tb button").forEach(b=>b.onclick=async()=>{const u=users.find(x=>x.id===b.dataset.id);await sb.from("profiles").update({suspended:!u.off}).eq("id",u.id);showDash()});
}
gate();
</script>
</body>
</html>
