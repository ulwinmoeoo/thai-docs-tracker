<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai Docs Tracker · စာရွက်စာတမ်း သတိပေး</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap">
<style>
:root{--bg:#070b1a;--bg2:#0e1532;--card:rgba(20,29,62,.72);--line:rgba(125,145,255,.2);--ink:#e9edff;--mute:#8f99c9;--brand:#6ea8ff;--brand2:#9b6bff;--on:#06102a;--ok:#2de2a0;--soon:#ffc14d;--late:#ff6b81;--okbg:rgba(45,226,160,.13);--soonbg:rgba(255,193,77,.14);--latebg:rgba(255,107,129,.15);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#eef1fb;--bg2:#fff;--card:rgba(255,255,255,.86);--line:#d5dcf4;--ink:#121a3b;--mute:#58628f;--brand:#3358e8;--brand2:#7a4de8;--on:#fff;--ok:#0e9d6b;--soon:#bf7800;--late:#d4314d;--okbg:#dff5ec;--soonbg:#fcefd2;--latebg:#fde0e5}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font:16px/1.6 "Space Grotesk","Noto Sans Myanmar",system-ui,sans-serif;background:radial-gradient(800px 480px at 90% -8%,rgba(155,107,255,.24),transparent 60%),radial-gradient(700px 500px at -10% 8%,rgba(110,168,255,.2),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
body.my{font-family:"Noto Sans Myanmar","Space Grotesk",system-ui,sans-serif;line-height:1.9}
main{position:relative;max-width:640px;margin:0 auto;padding:16px 16px 100px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0;line-height:1.25;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:.88rem;margin:2px 0 0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);backdrop-filter:blur(8px)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;font-weight:700}
.hero{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(10px);box-shadow:0 0 40px rgba(110,168,255,.1)}
.gauge{position:relative;width:132px;flex:none}
.gauge svg{width:100%;display:block;transform:rotate(-90deg)}
.g-bg,.g-fg{fill:none;stroke-width:9;stroke-linecap:round}
.g-bg{stroke:var(--line)}
.g-fg{filter:drop-shadow(0 0 6px currentColor)}
.g-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.g-num b{font:700 2rem/1 "JetBrains Mono",monospace}
.g-num span{font-size:.72rem;color:var(--mute);max-width:80px;line-height:1.3}
.g-info{min-width:0}.g-info h2{margin:2px 0;font-size:1.15rem}.g-k{margin:0;color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}.g-d{margin:0;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px)}
.tile b{display:block;font:700 1.6rem/1.1 "JetBrains Mono",monospace}.tile span{font-size:.78rem;color:var(--mute)}
.tile.ok b{color:var(--ok)}.tile.soon b{color:var(--soon)}.tile.late b{color:var(--late)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;margin:0 -16px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px;white-space:nowrap}
.chips button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);box-shadow:0 0 14px rgba(110,168,255,.3);font-weight:700}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok);box-shadow:0 0 14px var(--ok)}
.item.soon::before{background:var(--soon);box-shadow:0 0 14px var(--soon)}.item.late::before{background:var(--late);box-shadow:0 0 14px var(--late)}
.item h3{margin:0;font-size:1.02rem}.meta{color:var(--mute);font-size:.86rem;grid-column:1}
.days{grid-column:2;grid-row:1/3;text-align:right;align-self:center;line-height:1.1}
.days span{display:block;font:700 1.8rem/1.1 "JetBrains Mono",monospace}.days small{color:var(--mute);font-size:.74rem}
.ok .days span{color:var(--ok)}.soon .days span{color:var(--soon)}.late .days span{color:var(--late)}
.track{grid-column:1/3;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--soon),var(--late));background-size:var(--bs,300%) 100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pipe{grid-column:1/3;display:flex;gap:4px;margin-top:6px}
.pipe i{flex:1;height:6px;border-radius:99px;background:var(--line)}.pipe i.done{background:var(--brand)}.pipe i.cur{background:var(--brand2);box-shadow:0 0 10px var(--brand2)}
.row{grid-column:1/3;display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:none;border-radius:12px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.pri{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;font-weight:700}
.btn.del{color:var(--late)}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.empty{text-align:center;color:var(--mute);padding:32px 12px;border:1px dashed var(--line);border-radius:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 24px rgba(110,168,255,.45);border-radius:999px;padding:12px 22px;font-weight:700;border:0;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;cursor:pointer;min-height:48px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--bg2);color:var(--ink);width:min(92vw,460px);padding:18px;max-height:88vh;max-height:88dvh;overflow-y:auto}
dialog::backdrop{background:rgba(3,6,18,.65);backdrop-filter:blur(3px)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:44px}
.hint{color:var(--mute);font-size:.85rem;margin:4px 0 0}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:10px 0}.chk input{width:20px;height:20px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.note{background:var(--soonbg);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-top:12px}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:8px 0;min-height:40px}
.upl{display:flex;gap:8px;flex-wrap:wrap}.upl .btn{display:inline-flex;align-items:center;font-weight:600}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.rq{font-size:.82rem;border-radius:999px;padding:2px 10px;background:var(--soonbg);color:var(--soon);font-weight:600;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}.kv b{color:var(--mute);font-weight:600}
pre.pay{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin:6px 0}
.qr{display:block;width:min(260px,100%);margin:8px auto;border-radius:14px;border:1px solid var(--line);background:#fff}
@media (prefers-reduced-motion:no-preference){.hero,.item{animation:in .45s ease-out both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.g-fg{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}}
.hdr-r{display:flex;gap:8px;align-items:center}.btn.ic{padding:0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card)}
[hidden]{display:none!important}
.hdr-r{position:relative}.btn.ic{position:relative}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:99px;background:var(--late);color:#fff;font:700 .7rem "JetBrains Mono",monospace;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 10px var(--late)}
.menu{position:absolute;right:0;top:50px;width:min(92vw,340px);max-height:70vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:20}
.mh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.mi{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer;text-align:left}
.mi:hover{background:var(--line)}.mi i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--brand)}
.mi.quoted i,.mi.late i{background:var(--late)}.mi.soon i{background:var(--soon)}.mi.done i,.mi.confirmed i{background:var(--ok)}
.mi span{flex:1;min-width:0}.mi b,.mi small{display:block}.mi small,.mi time{color:var(--mute);font-size:.78rem}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--brand);border-radius:14px;padding:10px 16px;z-index:50;box-shadow:0 0 24px rgba(110,168,255,.4);max-width:90vw}
</style>
</head>
<body>
<main>
  <header>
    <div><h1 id="t-title"></h1><p class="sub" id="t-sub"></p></div>
    <div class="hdr-r"><button class="btn ic" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="bd" hidden>0</span></button><button class="btn ic" id="open-prof" aria-label="Profile"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button><div class="seg" role="group" aria-label="Language">
      <button id="l-my" aria-pressed="false">မြန်မာ</button>
      <button id="l-en" aria-pressed="true">EN</button>
    </div><div class="menu" id="bm" hidden></div></div>
  </header>
  <div id="next"></div>
  <div class="chips" id="chips" role="group"></div>
  <div id="list"></div>
  <button class="link" id="open-set"></button>
</main>
<button class="fab" id="add"></button>

<dialog id="dlg">
  <h2 id="d-title" style="margin:0 0 4px;font-size:1.15rem"></h2>
  <label for="f-cat" id="lb-cat"></label><select id="f-cat"></select>
  <label for="f-name" id="lb-name"></label><input type="text" id="f-name">
  <label for="f-date" id="lb-date"></label><input type="date" id="f-date">
  <p class="hint" id="hint-date"></p>
  <label for="f-rem" id="lb-rem"></label>
  <select id="f-rem"><option value="180">180</option><option value="90">90</option><option value="30">30</option><option value="14">14</option><option value="7">7</option><option value="3">3</option></select>
  <label for="f-note" id="lb-note"></label><textarea id="f-note" rows="2"></textarea>
  <label id="lb-photo"></label>
  <div class="upl"><label class="btn" for="f-cam" id="b-cam"></label><label class="btn" for="f-photo" id="b-gal"></label></div>
  <input type="file" id="f-photo" accept="image/*" class="vh"><input type="file" id="f-cam" accept="image/*" capture="environment" class="vh">
  <p class="hint" id="photo-msg" role="status"></p>
  <div id="photo-prev"></div>
  <div class="sheet-actions"><button class="btn" id="d-cancel"></button><button class="btn pri" id="d-save"></button></div>
</dialog>

<dialog id="adlg">
  <h2 id="a-title" style="margin:0 0 4px;font-size:1.15rem"></h2>
  <label for="a-email" id="lb-em"></label><input type="text" id="a-email" inputmode="email" autocomplete="username">
  <label for="a-pw" id="lb-pw"></label><input type="password" id="a-pw" autocomplete="current-password">
  <p class="hint" id="a-hint"></p>
  <p class="hint" id="a-msg" role="alert" style="color:var(--late)"></p>
  <div class="sheet-actions"><button class="btn" id="a-lang"></button><button class="btn" id="a-up"></button><button class="btn pri" id="a-in"></button></div>
</dialog>
<dialog id="pdlg">
  <h2 id="pf-title" style="margin:0 0 4px;font-size:1.15rem"></h2>
  <p class="hint" id="pf-opt"></p>
  <label for="pf-name" id="lb-pf-name"></label><input type="text" id="pf-name" autocomplete="name">
  <label for="pf-phone" id="lb-pf-phone"></label><input type="text" id="pf-phone" inputmode="tel" autocomplete="tel">
  <label for="pf-addr" id="lb-pf-addr"></label><textarea id="pf-addr" rows="2"></textarea>
  <label for="pf-line" id="lb-pf-line"></label><input type="text" id="pf-line" autocomplete="off">
  <label for="pf-email" id="lb-pf-email"></label><input type="text" id="pf-email" inputmode="email" autocomplete="email">
  <label for="pf-dob" id="lb-pf-dob"></label><input type="date" id="pf-dob">
  <label for="pf-emp" id="lb-pf-emp"></label><input type="text" id="pf-emp">
  <label for="pf-pref" id="lb-pf-pref"></label><select id="pf-pref"><option value="">-</option><option>LINE</option><option>Phone</option><option>Telegram</option><option>Viber</option><option>Email</option></select>
  <p class="hint" id="pf-msg" role="status"></p>
  <div class="sheet-actions"><button class="btn" id="pf-x"></button><button class="btn pri" id="pf-save"></button></div>
</dialog>
<dialog id="rdlg">
  <h2 id="r-title" style="margin:0 0 8px;font-size:1.1rem"></h2>
  <div id="r-body"></div>
  <div class="sheet-actions" id="r-act"></div>
</dialog>
<dialog id="cdlg">
  <p id="c-msg" style="margin:0 0 4px;font-weight:600"></p>
  <div class="sheet-actions"><button class="btn" id="c-no"></button><button class="btn pri" id="c-yes" style="background:var(--late);border-color:var(--late);color:#fff"></button></div>
</dialog>

<dialog id="set">
  <h2 id="s-title" style="margin:0 0 4px;font-size:1.15rem"></h2>
  <label class="chk"><input type="checkbox" id="s-browser"><span id="s-b"></span></label>
  <label class="chk"><input type="checkbox" id="s-line"><span id="s-l"></span></label>
  <input type="text" id="s-lineid" aria-label="LINE ID">
  <label class="chk"><input type="checkbox" id="s-tg"><span id="s-t"></span></label>
  <p class="note" id="s-note"></p>
  <div class="sheet-actions"><button class="btn" id="s-out"></button><button class="btn pri" id="s-close"></button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

 const L=t(),c={ok:0,soon:0,late:0};list.forEach(i=>c[state(i)]++);const nx=list[0];let g;
 if(nx){const n=left(nx),R=52,C=2*Math.PI*R,p=n<0?1:Math.max(.05,1-Math.min(n,365)/365),s=state(nx),col=s==="late"?"var(--late)":s==="soon"?"var(--soon)":"var(--ok)";

 return `<article class="item ${st}"><div><h3>${esc(L.cats[it.cat])}${it.name?" · "+esc(it.name):""}</h3></div>
